# Configuración de ejemplo del servidor NGINX.
# Sustituye "backend-demo" por el backend real que quieras proteger con el WAF.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Backend de ejemplo: en el docker-compose de este repo apunta a un contenedor
# "whoami" que solo sirve para comprobar que el proxy y el WAF funcionan.
# En un entorno real, cambia esto por tu servicio (p.ej. backend.example.com:443).
upstream backend-demo {
  least_conn;
  server backend:80 fail_timeout=30s max_fails=10;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;

    # Certificados de desarrollo autofirmados (ver scripts/generar-certificados-dev.sh).
    # Nunca subas a un repositorio público certificados o claves reales.
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_verify_client off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        include /opt/nginx_deny_tor.txt;
        client_max_body_size 0;
        include /opt/scripts/useragent.filter;
        modsecurity on;
        modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;
        proxy_set_header Host $host;
        proxy_set_header Proxy "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 36000s;
        proxy_redirect off;

        proxy_pass_header Authorization;
        proxy_pass http://backend-demo;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /metrics/nginx {
        access_log off;
        # Solo redes privadas (RFC1918). El repo original permitía 172.0.0.0/8,
        # que es más amplio que el rango privado real (172.16.0.0/12) e incluye
        # IPs públicas: se corrige aquí como ejemplo de buena práctica.
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_store off;
        stub_status;
    }

    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
