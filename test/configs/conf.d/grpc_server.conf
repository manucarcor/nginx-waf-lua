# gRPC server configuration
server {
    listen 9443 ssl;  # Puerto para gRPC con SSL
    http2 on;         # Habilitar HTTP/2 (nueva sintaxis)
    
    # TLS config (gRPC requiere TLS)
    ssl_certificate      /etc/nginx/ssl/server.crt;
    ssl_certificate_key  /etc/nginx/ssl/server.key;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_protocols        TLSv1.2 TLSv1.3;
    
    # gRPC specific settings
    grpc_connect_timeout 30s;
    grpc_send_timeout 30s;
    grpc_read_timeout 30s;
    
    # Security headers para gRPC
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    
    # WAF/ModSecurity para gRPC (comentado temporalmente)
    # modsecurity on;
    # modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;
    
    # Deny Tor addresses (comentado temporalmente)
    # include /opt/nginx_deny_tor.txt;
    
    # Block malicious user agents for gRPC
    if ($http_user_agent ~* (^w3af.sourceforge.net|dirbuster|nikto|wpscan|SF|sqlmap|fimap|nessus|whatweb|Openvas|jbrofuzz|libwhisker|webshag)) {
         return 444;
    }
    
    # gRPC backend routing
    location / {
        # Validar que es realmente gRPC
        if ($content_type !~ "^application/grpc") {
            return 415;  # Unsupported Media Type
        }
        
        grpc_pass grpc://grpc-backend;
        
        # Headers para debugging
        add_header X-gRPC-Proxied "true" always;
        
        # Error handling específico para gRPC
        error_page 502 = /grpc_502_error;
        error_page 503 = /grpc_503_error;
        error_page 504 = /grpc_504_error;
    }
    
    # Health check específico para gRPC
    location /grpc.health.v1.Health {
        grpc_pass grpc://grpc-backend;
        access_log off;
    }
    
    # Error responses para gRPC
    location = /grpc_502_error {
        internal;
        add_header grpc-status 14;  # UNAVAILABLE
        add_header grpc-message "Upstream server error";
        return 200 "";
    }
    
    location = /grpc_503_error {
        internal;
        add_header grpc-status 14;  # UNAVAILABLE
        add_header grpc-message "Service temporarily unavailable";
        return 200 "";
    }
    
    location = /grpc_504_error {
        internal;
        add_header grpc-status 4;   # DEADLINE_EXCEEDED
        add_header grpc-message "Request timeout";
        return 200 "";
    }
    
    # Location adicional para Jaeger UI
    location /jaeger {    
        proxy_pass http://jaeger:16686;
    }
    
    # Location para test OpenTelemetry  
    location /test-otel {    
        # otel_trace         on;
        # otel_trace_context propagate;
        add_header Content-Type text/plain;
        return 200 "OK - OpenTelemetry test endpoint";    
    }
}
