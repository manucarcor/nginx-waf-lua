# load_module modules/ngx_http_modsecurity_module.so;
# load_module modules/ngx_otel_module.so;

user  nginx;
worker_processes  1;

error_log  /tmp/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}


http {
    # include       /etc/nginx/conf/opentelemetry.conf;
    include       /etc/nginx/mime.types;
    # modsecurity on;
    # modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;
    default_type  application/json;

    # gRPC mime type
    map $content_type $grpc_content_type {
        ~^application/grpc  application/grpc;
        default             $content_type;
    }


    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /tmp/access.log  main;

    sendfile        on;

    keepalive_timeout  65;
   
    # include /etc/nginx/conf/api_json_errors.conf;
    # include /etc/nginx/conf/api_server.conf;
    include /etc/nginx/conf.d/*.conf;
}